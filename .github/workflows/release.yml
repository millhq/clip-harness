name: release

# Tag-triggered release pipeline: pushing a v<version> tag whose
# version matches pyproject.toml runs the full test suites as a
# gate, builds the wheel + sdist, and attaches them (with a
# SHA256SUMS file) to the GitHub Release for that tag. Installing
# the wheel needs no package index and no build step — that is the
# supported path for locked-down environments. If the release
# already exists (notes curated by hand), only assets are uploaded.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"
      - name: Install (with dev extras)
        run: pip install -e '.[dev]'
      - name: Run tests (gate)
        run: python -m pytest -q
      - name: Run E2E (gate)
        run: python tests_e2e/run_e2e.py
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — uploading assets only"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "clip-harness ${GITHUB_REF_NAME#v}" \
              --notes "Prebuilt wheel and source distribution are attached below. Installing the wheel needs no package index and no build step: pipx install --python <python3.12-path> ./clip_harness-*.whl — verify the download against SHA256SUMS first."
          fi
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
      - name: Publish release (a moved tag can leave it a draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
