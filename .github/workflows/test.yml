name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Headless sample session
        run: python examples/sample_session/run_demo.py > /tmp/demo.out 2>&1; tail -1 /tmp/demo.out
